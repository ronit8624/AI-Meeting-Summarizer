[project]
name = "ai-meeting-summarizer"
version = "0.1.0"
description = "AI Meeting Summarizer"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==1.26.4",

    "torch==2.1.2",
    "torchaudio==2.1.2",
    "torchvision==0.16.2",

    "pytorch-lightning==2.1.0",

    "faster-whisper==1.1.0",
    "whisperx==3.1.1",

    "pyannote.audio==3.1.1",

    "transformers==4.39.3",
    "tokenizers==0.15.2",

    "sentence-transformers==2.6.1",

    "langchain==0.1.16",
    "langchain-community==0.0.34",
    "langchain-core==0.1.46",
    "langchain-mistralai==0.1.6",

    "chromadb==0.4.24",
    "langchain-chroma==0.1.0",

    "streamlit==1.33.0",

    "yt-dlp==2024.4.9",
    "pydub==0.25.1",

    "python-dotenv==1.0.1",

    "mistralai==0.4.2",

    "pandas==2.2.1",
    "scipy==1.12.0",

    "ffmpeg-python==0.2.0",

    "ctranslate2==4.3.1",

    "sentencepiece==0.2.0",
    "soundfile==0.12.1",

    "pydantic==2.6.4",

    "setuptools==69.5.1"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
exclude = ["downloads*", "vector_db*"]